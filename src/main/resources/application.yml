spring:
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: jdbc:sqlite:homehub.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: true

google:
  client:
    id: ${GOOGLE_CLIENT_ID:not-configured}
    secret: ${GOOGLE_CLIENT_SECRET:not-configured}
    redirect-uri: http://localhost:8080/api/auth/callback